x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-mft-airflow:2.9.3}
  build:
    context: ./dockerfiles
    dockerfile: Dockerfile.airflow
  networks:
    - mft_airflow_network
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD:-airflow}@postgres/${AIRFLOW_DB:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD:-airflow}@postgres/${AIRFLOW_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 'false'
    # Metrics for Airflow 2.9.3
    AIRFLOW__METRICS__STATSD_DATADOG_METRICS_TAGS: 'true'
    AIRFLOW__METRICS__POOL_METRICS_INTERVAL: 5.0
    AIRFLOW__SCHEDULER__STATS_ON: 'true'
    AIRFLOW__SCHEDULER__PUBLISH_SCHEDULER_STAT: 'true'
    AIRFLOW__SCHEDULER__EMIT_POOL_METRICS: 'true'
    AIRFLOW__SCHEDULER__EMIT_POOL_STARVATION_METRICS: 'true'
    AIRFLOW__METRICS__DAG_FILE_PROCESSING_TIMES: 'true'
    AIRFLOW__CELERY__WORKER_HEARTBEAT_INTERVAL: 10
    # Time zone settings (Moscow Time)
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Europe/Moscow'
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'Europe/Moscow'
    # Connecting to mft_db database
    MFT_DB_HOST: ${DB_HOST:-db}
    MFT_DB_PORT: ${DB_PORT:-5432}
    MFT_DB_NAME: ${DB_NAME:-mft_db}
    MFT_DB_USER: ${DB_USER:-mft_user}
    MFT_DB_PASSWORD: ${DB_PASSWORD:-mft_password}
    DB_MAX_RETRIES: ${DB_MAX_RETRIES:-5}
    DB_RETRY_DELAY: ${DB_RETRY_DELAY:-2}
    # Show Python where to find modules and packages to import
    PYTHONPATH: /opt/airflow
  volumes:
    # Mount each directory from root project directory (mft_src)
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
    - ${AIRFLOW_PROJ_DIR:-.}/database:/opt/airflow/database
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/.env:/opt/airflow/.env
  user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-0}"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    db:
      condition: service_healthy

x-api-common:
    &api-common
    image: ${API_IMAGE_NAME:-mft-api:3.12.3-slim}
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    networks:
      - mft_airflow_network
    environment:
      &api-env
      # Flask settings
      FLASK_HOST: ${FLASK_HOST:-0.0.0.0}
      FLASK_PORT: ${FLASK_PORT:-5000}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      FLASK_ENV: ${FLASK_ENV:-development}
      # CORS (Cross-Origin Resource Sharing) settings
      # Controls which websites can access this API from browsers
      # Development: "*" (allow all - localhost, 127.0.0.1)
      # Production: comma-separated list of allowed domains (e.g., https://app.company.com)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # Rate limiting settings
      RATE_LIMIT: ${RATE_LIMIT:-10 per minute}          # Global rate limit for all endpoints
      RATE_LIMIT_STORAGE_URL: ${RATE_LIMIT_STORAGE_URL:-memory://}
      # Airflow connection
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_USER: ${AIRFLOW_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      DAG_ID: mft_etl_pipeline
      # ClamAV settings
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-1}
      TEMP_RETENTION_HOURS: ${TEMP_RETENTION_HOURS:-1}
      # Database connection
      MFT_DB_HOST: ${DB_HOST:-db}
      MFT_DB_PORT: ${DB_PORT:-5432}
      MFT_DB_NAME: ${DB_NAME:-mft_db}
      MFT_DB_USER: ${DB_USER:-mft_user}
      MFT_DB_PASSWORD: ${DB_PASSWORD:-mft_password}
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-5}
      DB_RETRY_DELAY: ${DB_RETRY_DELAY:-2}
      # Python path
      PYTHONPATH: /app
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/endpoints:/app/endpoints
      - ${AIRFLOW_PROJ_DIR:-.}/database:/app/database
      - ${AIRFLOW_PROJ_DIR:-.}/config:/app/config
      - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
      - ${AIRFLOW_PROJ_DIR:-.}/.env:/app/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

services:
  postgres:
    image: postgres:13
    container_name: airflow_db
    environment:
      POSTGRES_USER: ${AIRFLOW_USER:-admin}
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB:-airflow}
      TZ: 'Europe/Moscow'
    volumes:
      - airflow_db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_USER:-admin}"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - mft_airflow_network

  redis:
    image: redis:7.4.2
    container_name: airflow_redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - mft_airflow_network

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    restart: always
    ports:
      - 8081:8080
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mft_airflow_network

  db:
    image: postgres:13
    container_name: mft_db
    environment:
      POSTGRES_USER: ${DB_USER:-mft_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mft_password}
      POSTGRES_DB: ${DB_NAME:-mft_db}
    volumes:
      - mft_db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-mft_user}"]
      interval: 30s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - mft_airflow_network
  
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - prometheus_volume:/prometheus
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/monitoring/prometheus/recording_rules_airflow.yml:/etc/prometheus/recording_rules_airflow.yml
      - ./config/monitoring/prometheus/recording_rules_mft.yml:/etc/prometheus/recording_rules_mft.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=720h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    depends_on:
      postgres-exporter-airflow:
        condition: service_healthy
      postgres-exporter-mft:
        condition: service_healthy
      statsd-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mft_airflow_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana}
      - GF_INSTALL_PLUGINS=grafana-polystat-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_TIMEZONE=Europe/Moscow
    volumes:
      - grafana_volume:/var/lib/grafana
      - ./config/monitoring/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./config/monitoring/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./config/monitoring/grafana/dashboards/dashboard_mft.json:/etc/grafana/dashboards/mft_dashboard.json
      - ./config/monitoring/grafana/dashboards/dashboard_airflow.json:/etc/grafana/dashboards/airflow_dashboard.json
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mft_airflow_network
  
  postgres-exporter-airflow:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres_exporter_airflow
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB:-airflow}?sslmode=disable"
      PG_EXPORTER_CONFIG: /etc/postgres_exporter/queries_airflow.yml
    volumes:
      - ./config/monitoring/postgres_exporter/queries_airflow.yml:/etc/postgres_exporter/queries_airflow.yml
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - '--log.level=info'
      - '--web.listen-address=:9187'
      - '--extend.query-path=/etc/postgres_exporter/queries_airflow.yml'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mft_airflow_network
  
  postgres-exporter-mft:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres_exporter_mft
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-mft_user}:${DB_PASSWORD:-mft_password}@db:5432/${DB_NAME:-mft_db}?sslmode=disable"
      PG_EXPORTER_CONFIG: /etc/postgres_exporter/queries_mft.yml
    volumes:
      - ./config/monitoring/postgres_exporter/queries_mft.yml:/etc/postgres_exporter/queries_mft.yml
    ports:
      - "9188:9187"
    depends_on:
      db:
        condition: service_healthy
    command:
      - '--log.level=info'
      - '--web.listen-address=:9187'
      - '--extend.query-path=/etc/postgres_exporter/queries_mft.yml'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mft_airflow_network

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    container_name: statsd-exporter
    restart: unless-stopped
    volumes:
      - ./config/monitoring/statsd-exporter/statsd_mapping.yml:/etc/statsd-exporter/mapping.yml
    command:
      - '--log.level=info'
      - '--statsd.listen-udp=:9125'
      - '--web.listen-address=:9102'
      - '--statsd.mapping-config=/etc/statsd-exporter/mapping.yml'
    ports:
      - "9102:9102"  # Prometheus metrics
      - "9125:9125/udp"  # StatsD UDP
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mft_airflow_network

  redis-exporter:
    image: oliver006/redis_exporter:v1.68.0
    container_name: redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      # - REDIS_PASSWORD=${REDIS_PASSWORD}  # uncomment if the password would be added in .env
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mft_airflow_network
    healthcheck:
      test: ["CMD", "/redis_exporter", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        function ver() {
        printf "%04d%04d%04d%04d" $${1//./ }
        }

        airflow_version=$$(AIRFLOW__LOGGING__LOGGING_LEVEL=INFO && gosu airflow airflow version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        
        if [ -z "$airflow_version" ]; then
          echo "Could not detect Airflow version, assuming it's recent enough..."
          airflow_version="2.9.3"
        fi

        airflow_version_comparable=$$(ver $${airflow_version})
        min_airflow_version=2.2.0
        min_airflow_version_comparable=$$(ver $${min_airflow_version})

        echo "Detected Airflow version: $${airflow_version}"

        if (( 10#$${airflow_version_comparable} < 10#$${min_airflow_version_comparable} )); then
          echo
          echo -e "\033[1;31mERROR!!!: Too old Airflow version $${airflow_version}!\e[0m"
          echo "The minimum Airflow version supported: $${min_airflow_version}. Only use this or higher!"
          echo
          exit 1
        else
          echo -e "\033[1;32m✓ Airflow version $${airflow_version} is compatible\e[0m"
        fi

        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo " See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#settingthe-right-airflow-user"
          echo
        fi

        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"

        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi

        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi

        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi

        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see
          above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#beforeyou-begin"
          echo
        fi

        # mkdir -p /sources/logs /sources/dags /sources/plugins
        # chown -R "${AIRFLOW_UID:-1000}:0" /sources/{logs,dags,plugins}

        echo "Running Airflow initialization..."
        /entrypoint airflow version

        echo "Waiting for database to be ready..."

        for i in {1..30}; do
          if airflow db check 2>/dev/null; then
            echo "Database is ready!"
            break
          fi
          echo "Waiting for database... ($$i/30)"
          sleep 5
        done

        if ! airflow db check 2>/dev/null; then
          echo "ERROR: Database is still not ready after 150 seconds!"
          exit 1
        fi

        echo "Initializing database..."
        airflow db migrate

        echo "Creating admin user..."
        airflow users create \
          --username "${AIRFLOW_USER}" \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email admin@example.com \
          --password "${AIRFLOW_PASSWORD}" 2>/dev/null || true

        echo "Enabling mft_etl_pipeline DAG..."
        airflow dags unpause mft_etl_pipeline 2>/dev/null || true

        echo "Enabling ALL DAGs as fallback..."
        airflow dags unpause --all 2>/dev/null || true

        echo -e "\033[1;32m✓ Airflow initialization completed successfully!\e[0m"

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources
    depends_on:
      <<: *airflow-common-depends-on

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    container_name: airflow_cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - mft_airflow_network

  flower:
    <<: *airflow-common
    container_name: airflow_flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - mft_airflow_network

  upload-api:
    <<: *api-common
    container_name: mft_upload_api
    environment:
      <<: *api-env
      FLASK_PORT: 5002
    command: python /app/endpoints/upload_api.py
    ports:
      - "5002:5002"
    depends_on:
      clamav:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  display-api:
    <<: *api-common
    container_name: mft_display_api
    environment:
      <<: *api-env
      FLASK_PORT: 5003
    command: python /app/endpoints/display_api.py
    ports:
      - "5003:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  clamav:
    image: clamav/clamav:1.5.1
    container_name: clamav
    command:
      sh -c "
      echo 'Starting freshclam in background...' &&
      freshclam -d &&
      echo 'Waiting for freshclam to initialize...' &&
      sleep 30 &&
      echo 'Starting clamd...' &&
      clamd --foreground"
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
      - clamav_temp:/tmp
      - /etc/ssl/certs:/etc/ssl/certs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - mft_airflow_network
    environment:
      # Network settings
      - CLAMD_CONF_TCPAddr=0.0.0.0
      - CLAMD_CONF_TCPSocket=${CLAMAV_PORT:-3310}
      - CLAMD_CONF_LocalSocket=/tmp/clamd.sock
      - CLAMD_ENABLE=true
      # File size limits
      - CLAMD_CONF_MaxScanSize=${MAX_FILE_SIZE_MB:-5}M
      - CLAMD_CONF_MaxFileSize=${MAX_FILE_SIZE_MB:-5}M
      - CLAMD_CONF_StreamMaxLength=${MAX_FILE_SIZE_MB:-5}M
      # Scan settings
      - CLAMD_CONF_MaxRecursion=5
      - CLAMD_CONF_MaxFiles=1000
      - CLAMD_CONF_SelfCheck=3600
      # Enable all security scans
      - CLAMD_CONF_ScanPE=yes
      - CLAMD_CONF_ScanOLE2=yes
      - CLAMD_CONF_ScanHTML=yes
      - CLAMD_CONF_ScanMail=yes
      - CLAMD_CONF_ScanArchive=yes
      # Alert settings
      - CLAMD_CONF_AlertBrokenExecutables=yes
      - CLAMD_CONF_AlertEncrypted=yes
      - CLAMD_CONF_AlertEncryptedArchive=yes
      - CLAMD_CONF_AlertEncryptedDoc=yes
      # Freshclam (database updater) settings
      - FRESHCLAM_CONF_Checks=24
      - FRESHCLAM_CONF_DatabaseMirror=http://database.clamav.net
      - FRESHCLAM_CONF_LogSyslog=yes
      - FRESHCLAM_CONF_LogRotate=yes
      - FRESHCLAM_CONF_ConnectTimeout=30
      - FRESHCLAM_CONF_ReceiveTimeout=30
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

networks:
  mft_airflow_network:
    driver: bridge
    name: mft_airflow_network

volumes:
  airflow_db_volume:
    name: airflow_db_volume
  mft_db_volume:
    name: mft_db_volume
  prometheus_volume:
    name: prometheus_volume
  grafana_volume:
    name: grafana_volume
  clamav_db:
    name: clamav_db_volume
  clamav_temp:
    name: clamav_temp_volume
