server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from ALL Docker containers in this network
  - job_name: docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    
    relabel_configs:
      # Container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Service name (from docker-compose)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      
      # Project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      
      # Container image
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      
      # Keep only containers from our project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'mft_db'
        action: keep
      
      # Add log type based on service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'airflow-(scheduler|webserver|worker|dag-processor|triggerer|apiserver|init)'
        target_label: 'log_type'
        replacement: 'airflow'
      
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'mft-(upload|display)-api'
        target_label: 'log_type'
        replacement: 'api'
      
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'postgres|redis|db'
        target_label: 'log_type'
        replacement: 'database'
      
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'clamav'
        target_label: 'log_type'
        replacement: 'security'
      
      # Default log_type for unknown services
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '.+'
        target_label: 'log_type'
        replacement: 'other'
    
    # Parse JSON logs (since we use JSON format in logging_config.py)
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            timestamp: timestamp
            dag_id: dag_id
            task_id: task_id
            run_id: run_id
            module: module
            function: function
            thread: thread
            process: process
      
      # Extract level as label for faster filtering
      - labels:
          level: level
          dag_id: dag_id
          task_id: task_id
      
      # Fallback: if not JSON, use standard regex
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<level>\w+) - (?P<message>.*)$'
      
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.000"