server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '^mft[-_]src$'
        action: keep

      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
  
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'airflow-(scheduler|webserver|worker|dag-processor|triggerer|apiserver|init)'
        target_label: 'log_type'
        replacement: 'airflow'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'mft-(upload|display)-api'
        target_label: 'log_type'
        replacement: 'api'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '.*(postgres|redis|db).*'
        target_label: 'log_type'
        replacement: 'database'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '.*(clamav).*'
        target_label: 'log_type'
        replacement: 'security'

      - source_labels: ['log_type']
        regex: '^$'
        target_label: 'log_type'
        replacement: 'other'

    pipeline_stages:
      - match:
          selector: '{container=~".+"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
                  message: message
                  timestamp: timestamp
                  dag_id: dag_id
                  task_id: task_id
                  run_id: run_id
                  module: module
                  function: function
            - labels:
                level: level
                dag_id: dag_id
                task_id: task_id
            - timestamp:
                source: timestamp
                format: "2006-01-02 15:04:05.000"

      - match:
          selector: '{level=""}'
          stages:
            - regex:
                expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<fallback_level>\w+) - (?P<message>.*)$'
            - labels:
                level: fallback_level