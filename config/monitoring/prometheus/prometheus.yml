  # ============================================
  # REDIS METRICS (via redis-exporter)
  # ============================================
  - job_name: 'redis'
    
    scrape_interval: 30s
    scrape_timeout: 20s
    
    metrics_path: /metrics
    
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          job: redis
          service: redis
          component: celery_broker
          tier: data
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
