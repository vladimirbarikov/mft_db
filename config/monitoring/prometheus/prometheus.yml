  # ============================================
  # POSTGRES EXPORTER AIRFLOW EXTENDED
  # ============================================
  - job_name: 'airflow_db_extended'
    
    scrape_interval: 1m
    scrape_timeout: 45s
    
    metrics_path: /metrics
    
    static_configs:
      - targets: ['postgres_exporter_airflow:9187']
        labels:
          job: airflow_db_extended
          database: airflow_metadata
          exporter_type: postgres_extended
          scrape_frequency: low
          tier: data
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):9187'
        replacement: '${1}'
