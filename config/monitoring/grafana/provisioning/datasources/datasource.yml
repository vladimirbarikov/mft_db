# Grafana Datasource Provisioning Configuration for Material Flow Database Monitoring
# Based on database.py schema - Automotive production parts tracking
# Version: 1.0.0
# Date: 2026-02-11

apiVersion: 1

# ============================================
# DATASOURCES CONFIGURATION
# ============================================
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus-material-flow
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
      prometheusType: "Prometheus"
      prometheusVersion: "2.45.0"
      cacheLevel: "High"
      disableRecordingRules: false
      incrementalQueryOverlapWindow: "10m"
      seriesLimit: 1000
      seriesLimitPerMetric: 100