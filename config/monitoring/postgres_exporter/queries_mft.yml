# PostgreSQL Exporter queries for Material Flow Database
# Based on database.py schema - Automotive production parts tracking
# Version: 1.1.0
# Date: 2026-02-14

# ============================================
# MASTER DATA ENTITY COUNTERS
# ============================================

mft_suppliers_total:
  query: |
    SELECT COUNT(*) AS count
    FROM supplier_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of registered suppliers"

mft_parts_total:
  query: |
    SELECT COUNT(*) AS count
    FROM part_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of unique part numbers"

mft_active_parts_total:
  query: |
    SELECT COUNT(DISTINCT part_id) AS count
    FROM part_to_breakpoint
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of parts with active engineering change history"

mft_boxes_total:
  query: |
    SELECT COUNT(*) AS count
    FROM box_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of registered box numbers"

mft_pallets_total:
  query: |
    SELECT COUNT(*) AS count
    FROM pallet_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of registered pallet numbers"

mft_models_total:
  query: |
    SELECT COUNT(*) AS count
    FROM model_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of vehicle models"

mft_workshops_total:
  query: |
    SELECT COUNT(*) AS count
    FROM workshop_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of production workshops"

mft_lines_total:
  query: |
    SELECT COUNT(*) AS count
    FROM line_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of production lines"

mft_breakpoints_total:
  query: |
    SELECT COUNT(*) AS count
    FROM breakpoint_data
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of engineering breakpoints"

# ============================================
# RELATIONSHIP INTEGRITY METRICS
# ============================================

mft_parts_without_box:
  query: |
    SELECT COUNT(DISTINCT p.part_id) AS count
    FROM part_data p
    LEFT JOIN part_to_box pb ON p.part_id = pb.part_id
    WHERE pb.box_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Parts not assigned to any packaging box"

mft_parts_without_model:
  query: |
    SELECT COUNT(DISTINCT p.part_id) AS count
    FROM part_data p
    LEFT JOIN part_to_model pm ON p.part_id = pm.part_id
    WHERE pm.model_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Parts not assigned to any vehicle model"

mft_parts_without_line:
  query: |
    SELECT COUNT(DISTINCT p.part_id) AS count
    FROM part_data p
    LEFT JOIN part_to_line pl ON p.part_id = pl.part_id
    WHERE pl.line_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Parts not assigned to any production line"

mft_boxes_without_pallet:
  query: |
    SELECT COUNT(DISTINCT b.box_id) AS count
    FROM box_data b
    LEFT JOIN box_to_pallet bp ON b.box_id = bp.box_id
    WHERE bp.pallet_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Boxes not assigned to any pallet"

mft_boxes_without_parts:
  query: |
    SELECT COUNT(DISTINCT b.box_id) AS count
    FROM box_data b
    LEFT JOIN part_to_box pb ON b.box_id = pb.box_id
    WHERE pb.part_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Boxes not used by any part"

mft_models_without_parts:
  query: |
    SELECT COUNT(DISTINCT m.model_id) AS count
    FROM model_data m
    LEFT JOIN part_to_model pm ON m.model_id = pm.model_id
    WHERE pm.part_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Vehicle models with no assigned parts"

mft_lines_without_parts:
  query: |
    SELECT COUNT(DISTINCT l.line_id) AS count
    FROM line_data l
    LEFT JOIN part_to_line pl ON l.line_id = pl.line_id
    WHERE pl.part_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Production lines with no assigned parts"

mft_suppliers_without_parts:
  query: |
    SELECT COUNT(DISTINCT s.supplier_id) AS count
    FROM supplier_data s
    LEFT JOIN part_data p ON s.supplier_id = p.supplier_id
    WHERE p.part_id IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Suppliers with no parts registered"

mft_parts_per_box_avg:
  query: |
    SELECT COALESCE(AVG(part_per_box), 0) AS avg
    FROM part_to_box
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Average number of parts per box"

mft_boxes_per_pallet_avg:
  query: |
    SELECT COALESCE(AVG(box_per_pallet), 0) AS avg
    FROM box_to_pallet
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Average number of boxes per pallet"

mft_parts_per_vehicle_avg:
  query: |
    SELECT COALESCE(AVG(part_per_vehicle), 0) AS avg
    FROM part_to_model
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Average number of parts per vehicle model"

mft_parts_per_box_max:
  query: |
    SELECT COALESCE(MAX(part_per_box), 0) AS max
    FROM part_to_box
  master: true
  metrics:
    - max:
        usage: "GAUGE"
        description: "Maximum parts per single box configuration"

mft_parts_per_box_min:
  query: |
    SELECT COALESCE(MIN(part_per_box), 0) AS min
    FROM part_to_box
    WHERE part_per_box > 0
  master: true
  metrics:
    - min:
        usage: "GAUGE"
        description: "Minimum parts per single box configuration (positive values only)"

# ============================================
# DIRECT SUPPLIER LOCALIZATION METRICS
# ============================================

mft_suppliers_local_yes:
  query: |
    SELECT COUNT(*) AS count
    FROM supplier_data
    WHERE localization = 'yes'
  master: true
