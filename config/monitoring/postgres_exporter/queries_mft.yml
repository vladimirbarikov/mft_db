mft_suppliers_local_no:
  query: |
    SELECT COUNT(*) AS count
    FROM supplier_data
    WHERE localization = 'no'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of foreign suppliers"

# ============================================
# DIRECT BOX TYPE METRICS
# ============================================

mft_boxes_returnable:
  query: |
    SELECT COUNT(*) AS count
    FROM box_data
    WHERE box_type = 'returnable'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of returnable boxes"

mft_boxes_non_returnable:
  query: |
    SELECT COUNT(*) AS count
    FROM box_data
    WHERE box_type = 'non-returnable'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of non-returnable boxes"

# ============================================
# DIRECT PALLET TYPE METRICS
