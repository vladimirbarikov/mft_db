# ============================================
# DETAILED PARTS PER BOX METRICS
# ============================================

mft_parts_per_box_detail:
  query: |
    SELECT 
      box_id,
      part_id,
      part_per_box
    FROM part_to_box
    WHERE part_per_box IS NOT NULL
  master: true
  metrics:
    - box_id:
        usage: "LABEL"
        description: "Box identifier"
    - part_id:
        usage: "LABEL"
        description: "Part identifier"
    - part_per_box:
        usage: "GAUGE"
        description: "Number of parts per box"

# ============================================
# DISTRIBUTION BY ENUM TYPES (MULTI-ROW)
# ============================================

mft_suppliers_by_localization:
  query: |
    SELECT 
      localization::text AS localization,
      COUNT(*) AS count
    FROM supplier_data 
    WHERE localization IS NOT NULL
    GROUP BY localization
    ORDER BY localization
  master: true
  metrics:
    - localization:
        usage: "LABEL"
        description: "Supplier localization (yes=local, no=foreign)"
    - count:
        usage: "GAUGE"
        description: "Number of suppliers by localization"

mft_boxes_by_type:
  query: |
    SELECT 
      box_type::text AS box_type,
      COUNT(*) AS count
    FROM box_data 
    WHERE box_type IS NOT NULL
    GROUP BY box_type
    ORDER BY box_type
  master: true
  metrics:
    - box_type:
        usage: "LABEL"
        description: "Box type (returnable, non-returnable)"
    - count:
        usage: "GAUGE"
        description: "Number of boxes by type"

mft_pallets_by_type:
  query: |
    SELECT 
      pallet_type::text AS pallet_type,
      COUNT(*) AS count
    FROM pallet_data 
    WHERE pallet_type IS NOT NULL
    GROUP BY pallet_type
    ORDER BY pallet_type
  master: true
  metrics:
    - pallet_type:
        usage: "LABEL"
        description: "Pallet type (returnable, non-returnable)"
    - count:
        usage: "GAUGE"
        description: "Number of pallets by type"

mft_models_by_code:
  query: |
    SELECT 
      model_code::text AS model_code,
      COUNT(*) AS count
    FROM model_data 
    WHERE model_code IS NOT NULL
    GROUP BY model_code
    ORDER BY model_code
  master: true
  metrics:
    - model_code:
        usage: "LABEL"
        description: "Vehicle model code"
    - count:
        usage: "GAUGE"
        description: "Number of models by platform code"

mft_workshops_by_code:
  query: |
    SELECT 
      workshop_code::text AS workshop_code,
      COUNT(*) AS count
    FROM workshop_data 
    WHERE workshop_code IS NOT NULL
    GROUP BY workshop_code
    ORDER BY workshop_code
  master: true
  metrics:
    - workshop_code:
        usage: "LABEL"
        description: "Workshop code"
    - count:
        usage: "GAUGE"
        description: "Number of workshops by code"

mft_parts_by_workshop:
  query: |
    SELECT 
      w.workshop_code::text AS workshop_code,
      COUNT(DISTINCT pl.part_id) AS count
    FROM workshop_data w
    LEFT JOIN line_data l ON w.workshop_id = l.workshop_id
    LEFT JOIN part_to_line pl ON l.line_id = pl.line_id
    WHERE w.workshop_code IS NOT NULL
    GROUP BY w.workshop_code
    ORDER BY w.workshop_code
  master: true
  metrics:
    - workshop_code:
        usage: "LABEL"
        description: "Workshop code"
    - count:
        usage: "GAUGE"
        description: "Number of unique parts assigned to workshop"

mft_parts_by_model:
  query: |
    SELECT 
      m.model_code::text AS model_code,
      COUNT(DISTINCT pm.part_id) AS count
    FROM model_data m
    LEFT JOIN part_to_model pm ON m.model_id = pm.model_id
    WHERE m.model_code IS NOT NULL
    GROUP BY m.model_code
    ORDER BY m.model_code
  master: true
  metrics:
    - model_code:
        usage: "LABEL"
        description: "Vehicle model code"
    - count:
        usage: "GAUGE"
        description: "Number of unique parts used in model"

mft_parts_by_supplier_localization:
  query: |
    SELECT 
      s.localization::text AS localization,
      COUNT(p.part_id) AS count
    FROM part_data p
    LEFT JOIN supplier_data s ON p.supplier_id = s.supplier_id
    WHERE s.localization IS NOT NULL
    GROUP BY s.localization
    ORDER BY s.localization
  master: true
  metrics:
    - localization:
        usage: "LABEL"
        description: "Supplier localization (yes=local, no=foreign)"
    - count:
        usage: "GAUGE"
        description: "Number of parts by supplier localization"

mft_parts_by_box_type:
  query: |
    SELECT 
      b.box_type::text AS box_type,
      COUNT(pb.part_id) AS count
    FROM box_data b
    LEFT JOIN part_to_box pb ON b.box_id = pb.box_id
    WHERE b.box_type IS NOT NULL
    GROUP BY b.box_type
    ORDER BY b.box_type
  master: true
  metrics:
    - box_type:
        usage: "LABEL"
        description: "Box type (returnable, non-returnable)"
    - count:
        usage: "GAUGE"
        description: "Number of parts using each box type"

mft_lines_by_workshop:
  query: |
    SELECT 
      w.workshop_code::text AS workshop_code,
      COUNT(l.line_id) AS count
    FROM workshop_data w
    LEFT JOIN line_data l ON w.workshop_id = l.workshop_id
    WHERE w.workshop_code IS NOT NULL
    GROUP BY w.workshop_code
    ORDER BY w.workshop_code
  master: true
  metrics:
    - workshop_code:
        usage: "LABEL"
        description: "Workshop code"
    - count:
        usage: "GAUGE"
        description: "Number of production lines per workshop"

# ============================================
# PHYSICAL CHARACTERISTICS STATISTICS
# ============================================

mft_part_weight_min:
  query: |
    SELECT MIN(part_weight_kg) AS min
    FROM part_data
    WHERE part_weight_kg IS NOT NULL AND part_weight_kg > 0
  master: true
  metrics:
    - min:
        usage: "GAUGE"
        description: "Minimum part weight (kg)"

mft_part_weight_max:
  query: |
    SELECT MAX(part_weight_kg) AS max
    FROM part_data
    WHERE part_weight_kg IS NOT NULL AND part_weight_kg > 0
  master: true
  metrics:
    - max:
        usage: "GAUGE"
        description: "Maximum part weight (kg)"

mft_part_weight_avg:
  query: |
    SELECT AVG(part_weight_kg) AS avg
    FROM part_data
    WHERE part_weight_kg IS NOT NULL AND part_weight_kg > 0
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Average part weight (kg)"

mft_part_weight_stddev:
  query: |
    SELECT STDDEV(part_weight_kg) AS stddev
    FROM part_data
    WHERE part_weight_kg IS NOT NULL AND part_weight_kg > 0
  master: true
  metrics:
    - stddev:
        usage: "GAUGE"
        description: "Standard deviation of part weights"

mft_parts_with_weight_total:
  query: |
    SELECT COUNT(*) AS count
    FROM part_data
    WHERE part_weight_kg IS NOT NULL AND part_weight_kg > 0
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of parts with valid weight"

mft_box_dimensions_avg:
  query: |
    SELECT 
      'length' AS dimension,
      AVG(box_length_mm) AS value
    FROM box_data
    WHERE box_length_mm IS NOT NULL
    UNION ALL
    SELECT 
      'width' AS dimension,
      AVG(box_width_mm) AS value
    FROM box_data
    WHERE box_width_mm IS NOT NULL
    UNION ALL
    SELECT 
      'height' AS dimension,
      AVG(box_height_mm) AS value
    FROM box_data
    WHERE box_height_mm IS NOT NULL
  master: true
  metrics:
    - dimension:
        usage: "LABEL"
        description: "Box dimension type (length, width, height)"
    - value:
        usage: "GAUGE"
        description: "Average box dimension (mm)"

mft_box_dimensions_minmax:
  query: |
    SELECT 
      'length_min' AS stat,
      MIN(box_length_mm) AS value
    FROM box_data
    WHERE box_length_mm IS NOT NULL
    UNION ALL
    SELECT 
      'length_max' AS stat,
      MAX(box_length_mm) AS value
    FROM box_data
    WHERE box_length_mm IS NOT NULL
    UNION ALL
    SELECT 
      'width_min' AS stat,
      MIN(box_width_mm) AS value
    FROM box_data
    WHERE box_width_mm IS NOT NULL
    UNION ALL
    SELECT 
      'width_max' AS stat,
      MAX(box_width_mm) AS value
    FROM box_data
    WHERE box_width_mm IS NOT NULL
    UNION ALL
    SELECT 
      'height_min' AS stat,
      MIN(box_height_mm) AS value
    FROM box_data
    WHERE box_height_mm IS NOT NULL
    UNION ALL
    SELECT 
      'height_max' AS stat,
      MAX(box_height_mm) AS value
    FROM box_data
    WHERE box_height_mm IS NOT NULL
  master: true
  metrics:
    - stat:
        usage: "LABEL"
        description: "Statistics type"
    - value:
        usage: "GAUGE"
        description: "Box dimension min/max (mm)"

