# ============================================
# BREAKPOINT & TEMPORAL METRICS
# ============================================

mft_breakpoints_last_7_days:
  query: |
    SELECT COUNT(*) AS count
    FROM breakpoint_data
    WHERE breakpoint_date >= NOW() - INTERVAL '7 days'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Engineering breakpoints created in last 7 days"

mft_breakpoints_last_30_days:
  query: |
    SELECT COUNT(*) AS count
    FROM breakpoint_data
    WHERE breakpoint_date >= NOW() - INTERVAL '30 days'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Engineering breakpoints created in last 30 days"

mft_breakpoints_last_90_days:
  query: |
    SELECT COUNT(*) AS count
    FROM breakpoint_data
    WHERE breakpoint_date >= NOW() - INTERVAL '90 days'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Engineering breakpoints created in last 90 days"

mft_breakpoints_by_month:
  query: |
    SELECT 
      TO_CHAR(breakpoint_date, 'YYYY-MM') AS month,
      COUNT(*) AS count
    FROM breakpoint_data
    WHERE breakpoint_date IS NOT NULL
    GROUP BY month
    ORDER BY month DESC
    LIMIT 24
  master: true
  metrics:
    - month:
        usage: "LABEL"
        description: "Year-Month"
    - count:
        usage: "GAUGE"
        description: "Breakpoints per month"

mft_parts_per_breakpoint_avg:
  query: |
    SELECT COALESCE(AVG(part_count), 0) AS avg
    FROM (
      SELECT breakpoint_id, COUNT(part_id) AS part_count
      FROM part_to_breakpoint
      GROUP BY breakpoint_id
    ) AS breakpoint_stats
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Average number of parts changed per breakpoint"

mft_parts_per_breakpoint_max:
  query: |
    SELECT COALESCE(MAX(part_count), 0) AS max
    FROM (
      SELECT breakpoint_id, COUNT(part_id) AS part_count
      FROM part_to_breakpoint
      GROUP BY breakpoint_id
    ) AS breakpoint_stats
  master: true
  metrics:
    - max:
        usage: "GAUGE"
        description: "Maximum parts changed in single breakpoint"

mft_parts_per_breakpoint_min:
  query: |
    SELECT COALESCE(MIN(part_count), 0) AS min
    FROM (
      SELECT breakpoint_id, COUNT(part_id) AS part_count
      FROM part_to_breakpoint
      GROUP BY breakpoint_id
    ) AS breakpoint_stats
  master: true
  metrics:
    - min:
        usage: "GAUGE"
        description: "Minimum parts changed in single breakpoint (zero if none)"

mft_breakpoint_lag_avg_days:
  query: |
    SELECT COALESCE(
      AVG(EXTRACT(EPOCH FROM (breakpoint_date - input_date)) / 86400), 
      0
    ) AS avg
    FROM breakpoint_data
    WHERE breakpoint_date IS NOT NULL AND input_date IS NOT NULL
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Average days between input and breakpoint effective date"

mft_breakpoint_lag_max_days:
  query: |
    SELECT COALESCE(
      MAX(EXTRACT(EPOCH FROM (breakpoint_date - input_date)) / 86400), 
      0
    ) AS max
    FROM breakpoint_data
    WHERE breakpoint_date IS NOT NULL AND input_date IS NOT NULL
  master: true
  metrics:
    - max:
        usage: "GAUGE"
        description: "Maximum days between input and breakpoint effective date"

mft_oldest_breakpoints:
  query: |
    SELECT COUNT(*) AS count
    FROM breakpoint_data
    WHERE breakpoint_date < NOW() - INTERVAL '1 year'
      AND breakpoint_date IS NOT NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Breakpoints older than 1 year"

mft_future_breakpoints:
  query: |
    SELECT COUNT(*) AS count
    FROM breakpoint_data
    WHERE breakpoint_date > NOW()
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Scheduled breakpoints with future effective date"

# ============================================
# DATA QUALITY & INTEGRITY METRICS
# ============================================

mft_missing_supplier_city:
  query: |
    SELECT COUNT(*) AS count
    FROM supplier_data
    WHERE city IS NULL OR TRIM(city) = ''
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Suppliers missing city (mandatory for logistics)"

mft_missing_part_weight:
  query: |
    SELECT COUNT(*) AS count
    FROM part_data
    WHERE part_weight_kg IS NULL OR part_weight_kg <= 0
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Parts with missing or zero weight"

mft_missing_box_dimensions:
  query: |
    SELECT COUNT(*) AS count
    FROM box_data
    WHERE box_length_mm IS NULL 
      OR box_width_mm IS NULL 
      OR box_height_mm IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Boxes with incomplete dimensions"

mft_missing_pallet_dimensions:
  query: |
    SELECT COUNT(*) AS count
    FROM pallet_data
    WHERE pallet_length_mm IS NULL 
      OR pallet_width_mm IS NULL 
      OR pallet_height_mm IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Pallets with incomplete dimensions"

mft_missing_box_type:
  query: |
    SELECT COUNT(*) AS count
    FROM box_data
    WHERE box_type IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Boxes without specified type"

mft_missing_pallet_type:
  query: |
    SELECT COUNT(*) AS count
    FROM pallet_data
    WHERE pallet_type IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Pallets without specified type"

mft_zero_part_per_box:
  query: |
    SELECT COUNT(*) AS count
    FROM part_to_box
    WHERE part_per_box = 0 OR part_per_box IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Box-part assignments with zero quantity"

mft_zero_box_per_pallet:
  query: |
    SELECT COUNT(*) AS count
    FROM box_to_pallet
    WHERE box_per_pallet = 0 OR box_per_pallet IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Pallet-box assignments with zero quantity"

mft_zero_part_per_vehicle:
  query: |
    SELECT COUNT(*) AS count
    FROM part_to_model
    WHERE part_per_vehicle = 0 OR part_per_vehicle IS NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Model-part assignments with zero quantity"

mft_duplicate_part_numbers:
  query: |
    SELECT COUNT(*) - COUNT(DISTINCT part_number) AS count
    FROM part_data
    WHERE part_number IS NOT NULL
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Duplicate part numbers (critical data issue)"

mft_data_completeness_score:
  query: |
    WITH completeness AS (
      SELECT 
        (SELECT COUNT(*) FROM supplier_data WHERE city IS NOT NULL)::float / 
          NULLIF((SELECT COUNT(*) FROM supplier_data), 0) * 100 AS supplier_score,
        (SELECT COUNT(*) FROM part_data WHERE part_weight_kg > 0)::float / 
          NULLIF((SELECT COUNT(*) FROM part_data), 0) * 100 AS part_score,
        (SELECT COUNT(*) FROM box_data WHERE box_length_mm IS NOT NULL)::float / 
          NULLIF((SELECT COUNT(*) FROM box_data), 0) * 100 AS box_score,
        (SELECT COUNT(*) FROM pallet_data WHERE pallet_length_mm IS NOT NULL)::float / 
          NULLIF((SELECT COUNT(*) FROM pallet_data), 0) * 100 AS pallet_score
    )
    SELECT (supplier_score + part_score + box_score + pallet_score) / 4 AS avg
    FROM completeness
  master: true
  metrics:
    - avg:
        usage: "GAUGE"
        description: "Overall data completeness score (%)"

# ============================================
# INDEX & PERFORMANCE METRICS
# ============================================

mft_missing_foreign_key_indexes:
  query: |
    SELECT COUNT(*) AS count
    FROM (
      SELECT 
        conname AS constraint_name
      FROM pg_constraint c
      WHERE c.contype = 'f'
        AND NOT EXISTS (
          SELECT 1
          FROM pg_index i
          WHERE i.indrelid = c.conrelid
            AND i.indkey[0] = ANY(c.conkey)
            AND i.indisunique = false
        )
    ) AS missing_fk_idx
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of foreign keys without supporting indexes"

mft_unused_indexes:
  query: |
    SELECT COUNT(*) AS count
    FROM pg_stat_user_indexes i
    JOIN pg_index idx ON i.indexrelid = idx.indexrelid
    WHERE i.idx_scan = 0 
      AND NOT idx.indisunique
      AND NOT idx.indisprimary
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Indexes never scanned (potentially unused)"

mft_cache_hit_ratio:
  query: |
    SELECT COALESCE(
      ROUND(
        100 * SUM(heap_blks_hit) / 
        NULLIF(SUM(heap_blks_hit) + SUM(heap_blks_read), 0), 2
      ), 0
    ) AS ratio
    FROM pg_statio_user_tables
  master: true
  metrics:
    - ratio:
        usage: "GAUGE"
        description: "Cache hit ratio (should be >99%)"

mft_index_maintenance_days_since_vacuum:
  query: |
    SELECT COALESCE(
      ROUND(
        AVG(EXTRACT(EPOCH FROM NOW() - last_vacuum) / 86400)
      ), 0
    ) AS days
    FROM pg_stat_user_tables
    WHERE last_vacuum IS NOT NULL
  master: true
  metrics:
    - days:
        usage: "GAUGE"
        description: "Average days since last VACUUM"

mft_index_maintenance_days_since_analyze:
  query: |
    SELECT COALESCE(
      ROUND(
        AVG(EXTRACT(EPOCH FROM NOW() - last_analyze) / 86400)
      ), 0
    ) AS days
    FROM pg_stat_user_tables
    WHERE last_analyze IS NOT NULL
  master: true
  metrics:
    - days:
        usage: "GAUGE"
        description: "Average days since last ANALYZE"

mft_table_bloat_estimate:
  query: |
    SELECT 
      schemaname || '.' || tablename AS table_name,
      ROUND(100 * (GREATEST(avg_chain_len, 1) - 1) / GREATEST(avg_chain_len, 1), 2) AS bloat_percent
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
      AND avg_chain_len IS NOT NULL
    ORDER BY bloat_percent DESC
    LIMIT 20
  master: true
  metrics:
    - table_name:
        usage: "LABEL"
        description: "Schema qualified table name"
    - bloat_percent:
        usage: "GAUGE"
        description: "Estimated table bloat percentage (high values indicate need for VACUUM)"

# ============================================
# QUERY PERFORMANCE METRICS
# ============================================

mft_query_duration_seconds:
  query: |
    SELECT EXTRACT(EPOCH FROM (NOW() - query_start)) AS seconds
    FROM pg_stat_activity
    WHERE state = 'active'
      AND query NOT LIKE '%pg_stat_activity%'
      AND datname = current_database()
      AND query_start IS NOT NULL
    ORDER BY query_start ASC
    LIMIT 10
  master: true
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "Current query duration in seconds"