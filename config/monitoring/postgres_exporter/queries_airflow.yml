# PostgreSQL Exporter queries for Airflow Metadata Database
# Version: 1.0.0
# Date: 2026-02-14

# ============================================
# DATABASE SIZE & CONNECTIONS
# ============================================

airflow_db_size_bytes:
  query: "SELECT pg_database_size(current_database())"
  master: true
  metrics:
    - value:
        usage: "GAUGE"
        description: "Airflow metadata database size in bytes"

airflow_db_connections_active:
  query: |
    SELECT COUNT(*)
    FROM pg_stat_activity 
    WHERE datname = current_database()
      AND state = 'active'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Active connections to Airflow database"

airflow_db_connections_idle:
  query: |
    SELECT COUNT(*)
    FROM pg_stat_activity 
    WHERE datname = current_database()
      AND state = 'idle'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Idle connections to Airflow database"

airflow_db_connections_total:
  query: |
    SELECT COUNT(*)
    FROM pg_stat_activity 
    WHERE datname = current_database()
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total connections to Airflow database"

airflow_db_connections_idle_in_transaction:
  query: |
    SELECT COUNT(*)
    FROM pg_stat_activity 
    WHERE datname = current_database()
      AND state = 'idle in transaction'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Idle in transaction connections (potential locks)"

airflow_db_longest_running_query:
  query: |
    SELECT 
      COALESCE(MAX(EXTRACT(EPOCH FROM (NOW() - query_start))), 0)
    FROM pg_stat_activity
    WHERE state = 'active'
      AND query NOT LIKE '%pg_stat_activity%'
      AND datname = current_database()
  master: true
  metrics:
    - max:
        usage: "GAUGE"
        description: "Longest running query duration in seconds"

airflow_db_blocked_queries:
  query: |
    SELECT COUNT(*)
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
      AND datname = current_database()
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of blocked queries"

# ============================================
# DAG METRICS
# ============================================

airflow_dags_total:
  query: "SELECT COUNT(DISTINCT dag_id) FROM dag"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of DAGs in Airflow"

airflow_dags_paused:
  query: "SELECT COUNT(DISTINCT dag_id) FROM dag WHERE is_paused = true"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of paused DAGs"

airflow_dags_active:
  query: "SELECT COUNT(DISTINCT dag_id) FROM dag WHERE is_paused = false"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of active (unpaused) DAGs"

airflow_dags_with_errors:
  query: |
    SELECT COUNT(DISTINCT d.dag_id)
    FROM dag d
    WHERE d.is_paused = false 
      AND d.dag_id IN (
        SELECT dag_id 
        FROM dag_run 
        WHERE state = 'failed'
      )
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "DAGs with failed runs"

airflow_dags_not_run_7days:
  query: |
    SELECT COUNT(DISTINCT dag_id)
    FROM dag d
    WHERE NOT EXISTS (
      SELECT 1 
      FROM dag_run dr 
      WHERE dr.dag_id = d.dag_id 
        AND dr.execution_date >= NOW() - INTERVAL '7 days'
    )
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "DAGs not executed in last 7 days"

# ============================================
# DAG RUN METRICS
# ============================================

airflow_dag_runs_total:
  query: "SELECT COUNT(*) FROM dag_run"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total number of DAG runs"

airflow_dag_run_success_total:
  query: "SELECT COUNT(*) FROM dag_run WHERE state = 'success'"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total successful DAG runs"

airflow_dag_run_failed_total:
  query: "SELECT COUNT(*) FROM dag_run WHERE state = 'failed'"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total failed DAG runs"

airflow_dag_run_running:
  query: "SELECT COUNT(*) FROM dag_run WHERE state = 'running'"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Currently running DAG runs"

airflow_dag_run_queued:
  query: "SELECT COUNT(*) FROM dag_run WHERE state = 'queued'"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Currently queued DAG runs"

airflow_dag_runs_by_state:
  query: |
    SELECT 
      COALESCE(state, 'unknown') AS label,
      COUNT(*) AS value
    FROM dag_run
    GROUP BY label
  master: true
  metrics:
    - label:
        usage: "LABEL"
        description: "DAG run state (success, failed, running, queued)"
    - value:
        usage: "GAUGE"
        description: "Number of DAG runs by state"

airflow_dag_runs_last_24h:
  query: |
    SELECT COUNT(*)
    FROM dag_run
    WHERE execution_date >= NOW() - INTERVAL '24 hours'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "DAG runs in last 24 hours"

airflow_dag_runs_failed_last_24h:
  query: |
    SELECT COUNT(*)
    FROM dag_run
    WHERE execution_date >= NOW() - INTERVAL '24 hours'
      AND state = 'failed'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Failed DAG runs in last 24 hours"

airflow_dag_runs_success_rate_24h:
  query: |
    WITH last_24h AS (
      SELECT 
        COUNT(*) FILTER (WHERE state = 'success') as success_count,
        COUNT(*) as total_count
      FROM dag_run
      WHERE execution_date >= NOW() - INTERVAL '24 hours'
    )
    SELECT 
      CASE 
        WHEN total_count > 0 
        THEN ROUND((success_count::numeric / total_count * 100), 2)
        ELSE 100
      END
    FROM last_24h
  master: true
  metrics:
    - success_rate:
        usage: "GAUGE"
        description: "DAG run success rate (%) in last 24 hours"

airflow_dag_runs_duration_seconds_avg:
  query: |
    SELECT 
      COALESCE(AVG(EXTRACT(EPOCH FROM (end_date - start_date))), 0)
    FROM dag_run
    WHERE start_date IS NOT NULL 
      AND end_date IS NOT NULL
      AND execution_date >= NOW() - INTERVAL '7 days'
  master: true
  metrics:
    - avg_duration:
        usage: "GAUGE"
        description: "Average DAG run duration in seconds"

airflow_dag_runs_duration_seconds_max:
  query: |
    SELECT 
      COALESCE(MAX(EXTRACT(EPOCH FROM (end_date - start_date))), 0)
    FROM dag_run
    WHERE start_date IS NOT NULL 
      AND end_date IS NOT NULL
      AND execution_date >= NOW() - INTERVAL '7 days'
  master: true
  metrics:
    - max_duration:
        usage: "GAUGE"
        description: "Maximum DAG run duration in seconds"

# ============================================
# TASK INSTANCE METRICS
# ============================================

airflow_task_instances_total:
  query: "SELECT COUNT(*) FROM task_instance"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total number of task instances"

airflow_task_success_total:
  query: "SELECT COUNT(*) FROM task_instance WHERE state = 'success'"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total successful tasks"

airflow_task_failures_total:
  query: "SELECT COUNT(*) FROM task_instance WHERE state = 'failed'"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total failed tasks"

airflow_task_instances_by_state:
  query: |
    SELECT 
      COALESCE(state, 'unknown') AS label,
      COUNT(*) AS value
    FROM task_instance
    GROUP BY label
  master: true
  metrics:
    - label:
        usage: "LABEL"
        description: "Task state"
    - value:
        usage: "GAUGE"
        description: "Number of task instances by state"

airflow_tasks_running_now:
  query: "SELECT COUNT(*) FROM task_instance WHERE state = 'running'"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Currently running tasks"

airflow_tasks_queued_now:
  query: "SELECT COUNT(*) FROM task_instance WHERE state = 'queued'"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Currently queued tasks"

airflow_tasks_failed_last_24h:
  query: |
    SELECT COUNT(*)
    FROM task_instance
    WHERE start_date >= NOW() - INTERVAL '24 hours'
      AND state = 'failed'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Failed tasks in last 24 hours"

airflow_tasks_up_for_retry:
  query: "SELECT COUNT(*) FROM task_instance WHERE state = 'up_for_retry'"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Tasks waiting for retry"

airflow_task_retry_total:
  query: |
    SELECT SUM(try_number - 1) as total_retries
    FROM task_instance
    WHERE try_number > 1
  master: true
  metrics:
    - total_retries:
        usage: "COUNTER"
        description: "Total number of task retries"

airflow_tasks_avg_retries:
  query: |
    SELECT COALESCE(AVG(try_number - 1), 0)
    FROM task_instance
    WHERE start_date >= NOW() - INTERVAL '7 days'
      AND try_number > 1
  master: true
  metrics:
    - avg_retries:
        usage: "GAUGE"
        description: "Average retry count per task"

airflow_tasks_max_retries:
  query: |
    SELECT COALESCE(MAX(try_number - 1), 0)
    FROM task_instance
    WHERE start_date >= NOW() - INTERVAL '7 days'
      AND try_number > 1
  master: true
  metrics:
    - max_retries:
        usage: "GAUGE"
        description: "Maximum retry count"

airflow_task_duration_seconds_avg:
  query: |
    SELECT COALESCE(AVG(EXTRACT(EPOCH FROM (end_date - start_date))), 0)
    FROM task_instance
    WHERE start_date IS NOT NULL 
      AND end_date IS NOT NULL
      AND start_date >= NOW() - INTERVAL '7 days'
  master: true
  metrics:
    - avg_duration:
        usage: "GAUGE"
        description: "Average task duration in seconds"

airflow_task_failure_rate_24h:
  query: |
    WITH task_stats AS (
      SELECT 
        COUNT(*) FILTER (WHERE state = 'failed') as failed_count,
        COUNT(*) as total_count
      FROM task_instance
      WHERE start_date >= NOW() - INTERVAL '24 hours'
    )
    SELECT 
      CASE 
        WHEN total_count > 0 
        THEN ROUND((failed_count::numeric / total_count * 100), 2)
        ELSE 0
      END
    FROM task_stats
  master: true
  metrics:
    - failure_rate:
        usage: "GAUGE"
        description: "Task failure rate (%) in last 24 hours"

# ============================================
# POOL METRICS
# ============================================

airflow_pools_total:
  query: "SELECT COUNT(*) FROM slot_pool"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of pools"

airflow_pool_slots_total:
  query: |
    SELECT 
      COALESCE(pool, 'default') AS label,
      slots AS value
    FROM slot_pool
  master: true
  metrics:
    - pool:
        usage: "LABEL"
        description: "Pool name"
    - slots:
        usage: "GAUGE"
        description: "Total slots in pool"

airflow_pool_slots_used:
  query: |
    SELECT 
      pool AS label,
      COUNT(*) AS value
    FROM task_instance
    WHERE state IN ('running', 'queued')
    GROUP BY pool
  master: true
  metrics:
    - pool:
        usage: "LABEL"
        description: "Pool name"
    - used:
        usage: "GAUGE"
        description: "Currently used slots in pool"

airflow_pool_slots_queued:
  query: |
    SELECT 
      pool AS label,
      COUNT(*) AS value
    FROM task_instance
    WHERE state = 'queued'
    GROUP BY pool
  master: true
  metrics:
    - pool:
        usage: "LABEL"
        description: "Pool name"
    - queued:
        usage: "GAUGE"
        description: "Queued slots in pool"

# ============================================
# SCHEDULER METRICS
# ============================================

airflow_scheduler_heartbeat_count:
  query: |
    SELECT COUNT(DISTINCT hostname)
    FROM job
    WHERE job_type = 'SchedulerJob'
      AND state = 'running'
      AND latest_heartbeat > NOW() - INTERVAL '1 minute'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Active scheduler heartbeats"

airflow_scheduler_health:
  query: |
    SELECT 
      CASE 
        WHEN EXISTS (
          SELECT 1 
          FROM job 
          WHERE job_type = 'SchedulerJob' 
            AND state = 'running' 
            AND latest_heartbeat > NOW() - INTERVAL '30 seconds'
        ) THEN 1
        ELSE 0
      END
  master: true
  metrics:
    - health:
        usage: "GAUGE"
        description: "Scheduler health (1=healthy, 0=unhealthy)"

airflow_scheduler_loop_duration_seconds:
  query: |
    SELECT COALESCE(
      EXTRACT(EPOCH FROM (NOW() - latest_heartbeat)), 
      999
    )
    FROM job
    WHERE job_type = 'SchedulerJob'
      AND state = 'running'
    ORDER BY latest_heartbeat DESC
    LIMIT 1
  master: true
  metrics:
    - seconds_since_heartbeat:
        usage: "GAUGE"
        description: "Seconds since last scheduler heartbeat (approximates loop duration)"

# ============================================
# WORKER METRICS (from database)
# Note: Detailed worker metrics come from StatsD exporter
# ============================================

airflow_workers_active:
  query: |
    SELECT COUNT(DISTINCT hostname)
    FROM job
    WHERE job_type = 'LocalTaskJob'
      AND state = 'running'
      AND latest_heartbeat > NOW() - INTERVAL '1 minute'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Active Celery workers"

# ============================================
# VARIABLES & CONFIGURATION
# ============================================

airflow_variables_total:
  query: "SELECT COUNT(*) FROM variable"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of Airflow variables"

airflow_connections_total:
  query: "SELECT COUNT(*) FROM connection"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total number of Airflow connections"

# ============================================
# XCOM METRICS
# ============================================

airflow_xcom_count:
  query: |
    SELECT COUNT(*)
    FROM xcom
    WHERE "timestamp" >= NOW() - INTERVAL '7 days'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of XCom entries (last 7 days)"

airflow_xcom_total_size_bytes:
  query: |
    SELECT COALESCE(SUM(pg_column_size(value)), 0)
    FROM xcom
    WHERE "timestamp" >= NOW() - INTERVAL '7 days'
  master: true
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "Total XCom size in bytes (last 7 days)"

# ============================================
# SLA METRICS
# ============================================

airflow_sla_miss_total:
  query: "SELECT COUNT(*) FROM sla_miss"
  master: true
  metrics:
    - count:
        usage: "COUNTER"
        description: "Total number of SLA misses"

airflow_sla_miss_last_24h:
  query: |
    SELECT COUNT(*)
    FROM sla_miss
    WHERE execution_date >= NOW() - INTERVAL '24 hours'
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "SLA misses in last 24 hours"

# ============================================
# DATABASE PERFORMANCE (Table stats)
# ============================================

airflow_db_table_size_total:
  query: |
    SELECT 
      relname AS label,
      pg_total_relation_size(relid) AS value
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
    ORDER BY value DESC
    LIMIT 20
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table name"
    - size_bytes:
        usage: "GAUGE"
        description: "Total table size (including indexes) in bytes"

airflow_db_table_size_data:
  query: |
    SELECT 
      relname AS label,
      pg_relation_size(relid) AS value
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
    ORDER BY value DESC
    LIMIT 20
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table name"
    - size_bytes:
        usage: "GAUGE"
        description: "Table data size in bytes"

airflow_db_table_size_index:
  query: |
    SELECT 
      relname AS label,
      pg_indexes_size(relid) AS value
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
    ORDER BY value DESC
    LIMIT 20
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table name"
    - size_bytes:
        usage: "GAUGE"
        description: "Index size in bytes"

airflow_db_table_live_rows:
  query: |
    SELECT 
      relname AS label,
      n_live_tup AS value
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
      AND n_live_tup > 0
    ORDER BY value DESC
    LIMIT 20
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table name"
    - live_rows:
        usage: "GAUGE"
        description: "Live rows in table"

airflow_db_table_dead_rows:
  query: |
    SELECT 
      relname AS label,
      n_dead_tup AS value
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
      AND n_dead_tup > 0
    ORDER BY value DESC
    LIMIT 20
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table name"
    - dead_rows:
        usage: "GAUGE"
        description: "Dead rows in table"

airflow_db_table_dead_ratio:
  query: |
    SELECT 
      relname AS label,
      ROUND(100 * n_dead_tup / NULLIF(n_live_tup + n_dead_tup, 0), 2) AS value
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
      AND (n_live_tup + n_dead_tup) > 1000
      AND n_dead_tup > 0
    ORDER BY value DESC
    LIMIT 20
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table name"
    - dead_ratio:
        usage: "GAUGE"
        description: "Dead row ratio (%)"